<!DOCTYPE html>
<html>
<head>
  <title>SQL Injection - Query Execution</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

{{sidebar}}

<div class="content">
  <h1>SQL Injection - Query Execution</h1>
  <hr class="separator">

  <form method="POST">
    <input type="text" name="query" id="query" placeholder="SELECT * FROM products;">
    <button type="submit">Execute</button>
  </form>
  
  {{result}}

  
  <div>
    <h4>Query Executed:</h4>
    <code>{{query}}</code>
  </div>
  

</div>

{{footer}}

</body>
</html>
